name = "manoengine-online"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ------------------------------------------------------------
# 開発用(既定)。ManoEngine の Project Settings では
# Environment = Development のとき Development Base URL を使う。
# ------------------------------------------------------------

[[d1_databases]]
binding = "ONLINE_DB"
database_name = "manoengine-online-dev"
database_id = "ここに wrangler d1 create で得た ID を入れる"

[[kv_namespaces]]
binding = "ONLINE_KV"
id = "ここに wrangler kv namespace create で得た ID を入れる"

[[r2_buckets]]
binding = "ONLINE_R2"
bucket_name = "manoengine-online-dev"

[vars]
# 公開してよい値だけを vars へ置く。秘密情報は wrangler secret put を使う。
DEVELOPMENT_CLIENT_KEY = ""

# ------------------------------------------------------------
# 本番用。テスト Score が本番ランキングへ入らないよう Database も分ける(仕様書 52 項)。
#   wrangler deploy --env production
# ------------------------------------------------------------

[env.production]
name = "manoengine-online-production"

[[env.production.d1_databases]]
binding = "ONLINE_DB"
database_name = "manoengine-online-prod"
database_id = "ここに本番用 D1 の ID を入れる"

[[env.production.kv_namespaces]]
binding = "ONLINE_KV"
id = "ここに本番用 KV の ID を入れる"

[[env.production.r2_buckets]]
binding = "ONLINE_R2"
bucket_name = "manoengine-online-prod"

# 秘密情報は次のコマンドで登録する(ファイルへは書かない)。
#   wrangler secret put PRODUCTION_CLIENT_KEY --env production
#   wrangler secret put ADMIN_KEY --env production
